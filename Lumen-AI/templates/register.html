<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Register - Lumen</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">

</head>


<body class="auth-page">


    <main class="auth-card">


        <!-- Logo -->

        <a class="brand" href="/">

            <span class="logo">L</span>

            Lumen

        </a>


        <!-- Dark Mode -->

        <button
            class="icon-btn theme-toggle"
            type="button">

            🌙

        </button>


        <h1>
            Create your account
        </h1>


        <p class="muted">
            It takes less than a minute.
        </p>


        <!-- Registration Form -->

        <form
            method="post"
            id="register-form">


            <!-- Username -->

            <label for="username">
                Username
            </label>

            <input
                id="username"
                name="username"
                type="text"
                maxlength="40"
                autocomplete="username"
                required
            >


            <!-- Email -->

            <label for="email">
                Email
            </label>

            <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
            >


            <!-- Password -->

            <label for="password">

                Password

                <span class="hint">
                    (at least 8 characters)
                </span>

            </label>


            <div class="password-field">

                <input
                    id="password"
                    name="password"
                    type="password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    data-target="password">

                    Show

                </button>

            </div>


            <!-- Confirm Password -->

            <label for="confirm_password">
                Confirm password
            </label>

            <input
                id="confirm_password"
                name="confirm_password"
                type="password"
                autocomplete="new-password"
                required
            >


            <!-- Password Error -->

            <p
                class="field-error"
                id="confirm-error"
                hidden>

                The two passwords do not match.

            </p>


            <!-- Submit -->

            <button
                class="btn btn-primary btn-block"
                type="submit">

                Create account

            </button>


        </form>


        <!-- Login Link -->

        <p class="switch">

            Already registered?

            <a href="/login">
                Log in
            </a>

        </p>


    </main>


    <script src="/static/js/main.js"></script>

    <script src="/static/js/auth.js"></script>


</body>

</html>
