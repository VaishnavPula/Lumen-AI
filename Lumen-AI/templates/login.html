<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Log in - Lumen</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">

</head>


<body class="auth-page">


    <main class="auth-card">


        <!-- Logo -->

        <a class="brand" href="/">

            <span class="logo">L</span>

            Lumen

        </a>


        <!-- Dark Mode -->

        <button
            class="icon-btn theme-toggle"
            type="button">

            🌙

        </button>


        <h1>
            Welcome back
        </h1>


        <p class="muted">
            Log in to continue your conversations.
        </p>


        <!-- Login Form -->

        <form method="post">


            <label for="email">
                Email
            </label>


            <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
            >


            <label for="password">
                Password
            </label>


            <div class="password-field">


                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="button"
                    class="show-password"
                    data-target="password">

                    Show

                </button>


            </div>


            <button
                class="btn btn-primary btn-block"
                type="submit">

                Log in

            </button>


        </form>


        <!-- Register Link -->

        <p class="switch">

            New here?

            <a href="/register">
                Create an account
            </a>

        </p>


    </main>


    <script src="/static/js/main.js"></script>

    <script src="/static/js/auth.js"></script>


</body>

</html>
